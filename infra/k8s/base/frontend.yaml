apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: hse-csharp-gamification
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hse-csharp-gamification
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: hse-csharp-gamification
    spec:
      containers:
        - name: frontend
          image: hse-c_sharp-gamification-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3002
          env:
            - name: PORT
              value: "3002"
            - name: DISABLE_ESLINT_PLUGIN
              value: "true"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: 500m
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: hse-csharp-gamification
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: hse-csharp-gamification
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 3002
      targetPort: http
