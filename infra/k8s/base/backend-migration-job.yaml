apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: hse-csharp-gamification
  labels:
    app.kubernetes.io/name: backend-migrate
    app.kubernetes.io/part-of: hse-csharp-gamification
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
        app.kubernetes.io/part-of: hse-csharp-gamification
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: hse-c_sharp-gamification-backend:latest
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              attempt=1
              max_attempts="${DB_MIGRATION_MAX_ATTEMPTS:-30}"
              retry_seconds="${DB_MIGRATION_RETRY_SECONDS:-2}"
              until alembic upgrade head; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Migration failed after ${attempt} attempts"
                  exit 1
                fi
                echo "Migration attempt ${attempt} failed. Retrying in ${retry_seconds}s..."
                attempt=$((attempt + 1))
                sleep "$retry_seconds"
              done
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secret
          env:
            - name: DB_MIGRATION_MAX_ATTEMPTS
              value: "30"
            - name: DB_MIGRATION_RETRY_SECONDS
              value: "2"
